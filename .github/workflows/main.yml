name: Daily Weather Bot

on:
  schedule:
    # Запуск каждый день в 05:00 по UTC (это 08:00 по Москве/Краснодару)
    - cron: '0 4 * * *'
  workflow_dispatch: # Позволяет запускать вручную для теста

jobs:
  send-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v3

      - name: Устанавливаем Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Устанавливаем библиотеки
        run: |
          python -m pip install --upgrade pip
          pip install aiogram aiohttp

      - name: Запускаем бота
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWM_API_KEY: ${{ secrets.OWM_KEY }}
          MY_CHAT_ID: ${{ secrets.MY_ID }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_ID }}
        run: python Weather.py
