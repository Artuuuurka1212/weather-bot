name: Daily Weather Bot

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch: # Позволяет запускать вручную для теста

jobs:
  send-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v3

      - name: Устанавливаем Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Устанавливаем шрифты для карточки
  run: |
    sudo apt-get update
    sudo apt-get install -y fonts-dejavu fonts-noto-color-emoji
    
    - name: Устанавливаем библиотеки
  run: |
    python -m pip install --upgrade pip
    pip install aiogram aiohttp python-dotenv Pillow

      - name: Запускаем бота
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWM_API_KEY: ${{ secrets.OWM_KEY }}
          MY_CHAT_ID: ${{ secrets.MY_ID }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_ID }}
        run: python Weather.py
